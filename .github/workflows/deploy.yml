name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # 當程式碼 push 到 main 分支時觸發

permissions:
  contents: write # 賦予 Action 寫入分支的權限（用來推送打包後的檔案）

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 複製 GitHub 儲存庫的程式碼到虛擬機中
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      # 2. 設定 Node.js 環境（若為純 HTML 專案可刪除 2, 3 步驟）
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. 安裝套件並打包專案
      - name: Install and Build 🔧
        run: |
          npm ci
          npm run build

      # 4. 部署至 GitHub Pages
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # 打包後的資料夾名稱（React 通常是 build，Vite/Vue 通常是 dist）
          branch: gh-pages # 部署到的目標分支
